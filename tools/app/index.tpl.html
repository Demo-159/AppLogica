<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Razona</title>
<style>
/*FUENTE*/
:root{--bg:#131F24;--card:#1E2B32;--line:#37464F;--ink:#F1F7FB;--muted:#9AB0BC;--green:#58CC02;--greend:#46A302;--blue:#1CB0F6;--blued:#1899D6;--red:#FF4B4B;--redd:#C81E1E;--gold:#FFC800;--orange:#FF9600;--ui:"Nunito","RBEmoji","RBSimbolos","RBSimbolos2","RBSimbolos3",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);display:flex;justify-content:center}
.app{width:100%;max-width:460px;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.view{display:none;flex-direction:column;flex:1;min-height:0}.view.on{display:flex}
#v-map{position:relative} /* la ventana de la parada y el botón flotante quedan sobre la barra de pestañas */
.tabs{display:flex;border-top:2px solid var(--line);background:var(--bg);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}.tabs[hidden]{display:none}
.tab{flex:1;background:none;border:0;color:var(--muted);font-family:var(--ui);font-weight:900;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;position:relative;cursor:pointer}
.tab .i{font-size:23px;line-height:1}.tab.on{color:var(--blue);background:#17303D}
.tab .badge{position:absolute;top:1px;left:54%;background:var(--orange);color:#fff;border-radius:9px;font-size:10.5px;padding:1px 6px;min-width:18px}.tab .badge[hidden]{display:none}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px}
.panel h3{margin:0;font-size:18px}.panel .muted{font-size:14px;line-height:1.35}
.cifra{font-size:44px;font-weight:900;color:var(--gold);line-height:1}
.fila{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800}
.mini{font-family:var(--ui);font-weight:900;font-size:13px;border:2px solid var(--line);background:none;color:var(--ink);border-radius:10px;padding:6px 10px;cursor:pointer}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats div{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px}.stats b{display:block;font-size:26px;color:var(--gold)}.stats span{font-size:13px;font-weight:800;color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:2px solid var(--line)}
.chip{display:flex;align-items:center;gap:6px;font-weight:900;font-size:16px}
.x{background:none;border:0;color:var(--muted);font-size:24px;cursor:pointer;padding:0 4px;font-family:var(--ui)}
.scroll{flex:1;overflow-y:auto;position:relative}
#map{display:block;width:100%}
.node{cursor:pointer}.node:focus{outline:none}
@keyframes pulse{0%{r:42;opacity:.6}100%{r:58;opacity:0}}.pulse{animation:pulse 1.4s infinite}
@keyframes bob{50%{transform:translateY(-4px)}}.bob{animation:bob 1.6s ease-in-out infinite}
.capbar{position:sticky;top:0;z-index:3;margin:10px 12px 0;border-radius:18px;padding:10px 14px;color:#fff;display:flex;align-items:center;gap:12px;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:background .3s}
.capbar .t{flex:1;min-width:0}.capbar small{display:block;font-size:12px;font-weight:900;letter-spacing:1.2px;opacity:.85}.capbar b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.capbar .av{font-weight:900;font-size:13px;background:rgba(0,0,0,.22);border-radius:10px;padding:4px 9px;white-space:nowrap}
@keyframes flota{50%{transform:translateY(-5px)}}.flota{animation:flota 1.4s ease-in-out infinite}
.pop .tira{height:8px;border-radius:8px 8px 0 0;margin:-14px -14px 12px}.pop .cap{font-size:12px;font-weight:900;letter-spacing:1px;color:var(--muted)}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pchips span{background:#26363F;border-radius:10px;padding:4px 9px;font-size:12.5px;font-weight:900;color:var(--ink)}
.lechero{border-radius:18px;padding:16px;color:#fff}.lechero small{font-size:12px;font-weight:900;letter-spacing:1.2px;opacity:.85}.lechero b{display:block;font-size:22px;margin-top:2px}
.opt{display:flex;align-items:center;gap:12px}.opt .le{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:900;color:var(--muted)}
.opt.sel .le{border-color:var(--blue);color:var(--blue)}.opt.good .le{border-color:var(--green);color:var(--green)}.opt.bad .le{border-color:var(--red);color:var(--red)}
@keyframes subir{from{transform:translateY(30px);opacity:.3}}.foot.ok,.foot.ko{animation:subir .25s ease-out}
.hero{border-radius:20px;padding:18px;color:#fff;display:flex;flex-direction:column;gap:6px}.hero .cifra{color:#fff}.hero .muted{color:rgba(255,255,255,.85)}
.anillo{display:flex;align-items:center;gap:16px}.anillo svg{flex:none}
.seguir{position:absolute;right:14px;bottom:16px;z-index:3;max-width:70%;border:0;border-radius:16px;padding:11px 14px;font-family:var(--ui);font-weight:900;font-size:14px;color:#fff;background:var(--blue);box-shadow:0 5px 0 var(--blued);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aviso{background:#3A2A0A;border:2px solid var(--orange);border-radius:14px;padding:10px 12px;color:#FFD9A0;font-weight:800;font-size:14px;line-height:1.4;margin-top:8px}
.pop{position:absolute;left:16px;right:16px;bottom:20px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;z-index:4;transform:translateY(20px);opacity:0;pointer-events:none;transition:.2s}
.pop.on{transform:none;opacity:1;pointer-events:auto}
.pop .head{display:flex;gap:12px;align-items:center}
.pop .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:28px;flex:none}
.pop b{font-size:19px;display:block}.pop span{color:var(--muted);font-weight:800;font-size:14px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;margin-top:12px;font-family:var(--ui);font-weight:900;font-size:16px;letter-spacing:.5px;color:#fff;background:var(--blue);box-shadow:0 5px 0 var(--blued);cursor:pointer;text-transform:uppercase}
.btn.g{background:var(--green);box-shadow:0 5px 0 var(--greend)}.btn.o{background:var(--orange);box-shadow:0 5px 0 #CC7800}.btn.r{background:var(--red);box-shadow:0 5px 0 var(--redd)}
.btn.y{background:var(--gold);color:#3a2a00;box-shadow:0 5px 0 #C99E00}
.btn[hidden]{display:none}
.btn:disabled{background:var(--line);box-shadow:0 5px 0 #2a363d;color:var(--muted);cursor:default}
.bar{flex:1;height:14px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:9px;transition:width .4s}
.qwrap{flex:1;display:flex;flex-direction:column;gap:10px;padding:16px;overflow-y:auto}
.tag{font-weight:900;font-size:13px;letter-spacing:1px}
.q{font-weight:900;font-size:20px;line-height:1.3;margin:2px 0 6px}
.opt{font-family:var(--ui);font-weight:800;font-size:16px;text-align:left;padding:14px;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);color:var(--ink);cursor:pointer}
.opt.sel{border-color:var(--blue);color:var(--blue)}.opt.good{border-color:var(--green);color:var(--green)}.opt.bad{border-color:var(--red);color:var(--red)}
.foot{padding:12px 16px 18px;border-top:2px solid var(--line)}
/* bienvenida (solo la primera vez) */
#intro{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}#intro.on{display:flex}
#intro .skip{align-self:flex-end;margin:16px 18px 0;background:none;border:0;color:var(--muted);font-family:var(--ui);font-weight:900;font-size:14px;letter-spacing:.5px;cursor:pointer}
#intro .art{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}#intro .art svg{max-height:100%;width:auto}
#intro h2{margin:8px 24px 6px;font-size:24px;text-align:center}#intro p{margin:0 28px;text-align:center;color:var(--muted);font-weight:700;font-size:16px;line-height:1.35}
#intro .dots{display:flex;justify-content:center;gap:8px;margin:22px 0 4px}#intro .dots i{width:9px;height:9px;border-radius:9px;background:var(--line);transition:width .2s}#intro .dots i.on{background:var(--blue);width:22px}
#intro .foot{border:0}
.aviso{display:flex;gap:10px;align-items:center;background:#2a2410;border:2px solid #5c4a10;border-radius:16px;padding:10px 12px;font-weight:800;font-size:14px;color:#FFD970}
#tipRacha{position:fixed;z-index:55;top:58px;right:12px;background:#fff;color:#131F24;border-radius:14px;padding:10px 14px;font-weight:800;font-size:14px;width:190px;box-shadow:0 6px 20px rgba(0,0,0,.5);display:none}
#tipRacha.on{display:block}#tipRacha:before{content:"";position:absolute;top:-8px;right:22px;border:8px solid transparent;border-top:0;border-bottom-color:#fff}
#racha{cursor:pointer}
.chip.logo{gap:9px;font-size:21px}
.pill{display:flex;align-items:center;gap:6px;background:#3a2a10;border:2px solid var(--orange);color:var(--orange);border-radius:999px;padding:3px 12px 3px 9px;font-weight:900;font-size:17px}

.qrow{display:flex;gap:10px}.qrow .btn{flex:1}#qprev{flex:0 0 auto;width:56px;padding:8px 0;font-size:26px;line-height:1;background:none;border:2px solid var(--line);box-shadow:none;color:var(--muted)}
.foot.ok{background:#203A12;border-color:#203A12}.foot.ko{background:#3D1A1C;border-color:#3D1A1C}
.fbt{font-weight:900;font-size:19px}.fbx{font-weight:800;font-size:14px;margin-top:4px;color:var(--ink);opacity:.9}
.timer{font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
.dbl{display:inline-block;background:var(--gold);color:#3a2a00;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:900;margin-left:6px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px}
.big{font-size:64px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin:14px 0}
.facts div{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px}
.facts b{display:block;font-size:26px;color:var(--gold)}.facts span{font-size:13px;font-weight:800;color:var(--muted)}
.score{font-size:56px;font-weight:900}
.chbar{display:flex;align-items:center;gap:10px;width:100%;font-weight:800;font-size:14px;margin:4px 0}
.chbar span{width:120px;text-align:left;color:var(--muted)}.chbar .bar{height:12px}
.miss{width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px;font-size:14px;font-weight:800}
.miss b{display:block;color:var(--ink);margin-bottom:4px}.miss .ok{color:var(--green)}.miss small{color:var(--muted)}
.muted{color:var(--muted);font-weight:800}
.pend{background:#2A1E0A;border:2px solid var(--orange);color:var(--orange);border-radius:12px;padding:4px 10px;font-family:var(--ui);cursor:pointer}.pend.cero{border-color:var(--line);color:var(--muted);background:none}
.cita{background:var(--card);border:2px solid var(--line);border-left:6px solid var(--cc,var(--blue));border-radius:14px;padding:12px 14px;font-weight:800;font-size:16px;line-height:1.45}
.cita small{display:inline-block;color:var(--muted);font-size:12px;margin-top:8px;background:#26363F;border-radius:8px;padding:2px 8px}.cita img{display:block;max-height:120px;max-width:70%;margin:0 auto 8px;border-radius:10px;background:#fff;padding:6px}
.lecintro{color:var(--muted);font-weight:800;font-size:14px;line-height:1.4}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style></head><body>
<div class="app">

<!-- MAP -->
<section class="view on" id="v-map">
 <div class="top"><div class="chip logo"><svg width="32" height="32" viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#lg)"/><path d="M150 360 L256 150 L362 360" fill="none" stroke="#fff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/><circle cx="256" cy="150" r="30" fill="#fff"/><circle cx="150" cy="360" r="30" fill="#fff"/><circle cx="362" cy="360" r="30" fill="#fff"/><path d="M196 290 H316" stroke="#fff" stroke-width="32" stroke-linecap="round" opacity=".85"/></svg>Razona</div><div class="pill" id="racha" role="button" aria-label="Racha de días"></div></div>
 <div class="scroll" id="scroll"><div class="capbar" id="capbar"><div class="t"><small id="cbn"></small><b id="cbt"></b></div><span class="av" id="cba"></span></div><svg id="map" xmlns="http://www.w3.org/2000/svg" style="margin-top:-66px"></svg></div>
 <button class="seguir" id="seguir" hidden></button>
 <div class="pop" id="pop"><div class="tira" id="ptira"></div><div class="head"><div class="ic" id="pi"></div><div style="min-width:0"><span class="cap" id="pcap"></span><b id="pt"></b></div></div><div id="ps" class="muted" style="font-size:14px;margin-top:6px"></div><button class="btn" id="pb"></button><button class="btn g" id="pb2" hidden></button></div>
</section>

<!-- QUIZ (repaso / prueba de capítulo / simulacro) -->

 <div class="top"><button class="x" id="qx" aria-label="Salir">✕</button><div class="bar"><i id="qbar"></i></div><div class="timer" id="qtime"></div></div>
 <div class="qwrap" id="qbody"></div>
 <div class="foot" id="qfoot"><div id="qfb"></div><div class="qrow"><button class="btn" id="qprev" aria-label="Pregunta anterior"><svg width="22" height="22" viewBox="0 0 24 24" style="display:block;margin:auto"><path d="M15 4 L7 12 L15 20" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="btn g" id="qbtn" disabled>Comprobar</button></div></div>
</section>

<section class="view" id="v-repaso"><div class="top"><div class="chip">🔋 Repaso</div></div><div class="qwrap" id="rbody"></div></section>

 <button class="tab on" data-t="map"><span class="i">🗺️</span>Ruta</button>
 <button class="tab" data-t="repaso"><span class="i">🔋</span>Repaso<span class="badge" id="tbadge" hidden></span></button>
 <button class="tab" data-t="examen"><span class="i">🏆</span>Examen</button>
 <button class="tab" data-t="progreso"><span class="i">📊</span>Progreso</button>
</nav>

<script>
const BANK=__BANK__;
const $=id=>document.getElementById(id);
const TABS=['map','repaso','examen','progreso'];let TAB='map';
const show=v=>{document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));document.getElementById('tabs').hidden=!TABS.includes(v);document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.t===v))};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- PROGRESO (en el teléfono) ---------- */
const PK='razona-progreso';let PR={hechas:{},srs:{},dias:[],tutorFallos:{}};
try{PR=Object.assign(PR,JSON.parse(localStorage.getItem(PK)||'{}'))}catch(e){}
const guardar=()=>{try{localStorage.setItem(PK,JSON.stringify(PR))}catch(e){}};
/* Repetición espaciada (cajas de Leitner): cada pregunta respondida tiene una caja 0–5 y una fecha en que vuelve.
   Acertar la sube de caja (vuelve en 1, 3, 7, 14 o 30 días); fallar la baja a la caja 0 (vuelve hoy mismo). */
const INTERVALO=[0,1,3,7,14,30];
const enDias=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
function registrar(q,ok){const r=PR.srs[q.id]||{b:0};r.b=ok?Math.min((r.b||0)+1,5):0;r.d=enDias(INTERVALO[r.b]);PR.srs[q.id]=r}
const qPorId={};BANK.Q.forEach(q=>qPorId[q.id]=q);
// lo pendiente de hoy: primero lo fallado (caja 0), luego lo que está por olvidarse (más atrasado primero)
function pendientes(cap){const h=hoy();return Object.entries(PR.srs).filter(([id,r])=>r.d<=h&&qPorId[id]&&estudiada(qPorId[id].s)&&(!cap||capDe(qPorId[id].s)===cap))
 .sort((a,b)=>a[1].b-b[1].b||(a[1].d<b[1].d?-1:1)).map(([id])=>qPorId[id])}
function migrar(){
 // errores en las preguntas de una sesión con tutor: sus preguntas de práctica entran al repaso de hoy
 Object.keys(PR.tutorFallos||{}).forEach(sid=>{BANK.Q.filter(q=>q.s===sid).forEach(q=>{const r=PR.srs[q.id];if(!r||r.b>0)PR.srs[q.id]={b:0,d:hoy()}})});
 PR.tutorFallos={};guardar()}
const hoy=()=>new Date().toISOString().slice(0,10);
function estudiado(){if(!PR.dias.includes(hoy())){PR.dias.push(hoy());PR.dias=PR.dias.slice(-400)}guardar();racha()}
function racha(){let n=0,d=new Date();const set=new Set(PR.dias);if(!set.has(hoy()))d.setDate(d.getDate()-1);
 while(set.has(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}$('racha').innerHTML='<svg width="16" height="20" viewBox="0 0 16 20" aria-hidden="true"><path d="M8 0 C9 5 15 7 15 13 A7 7 0 0 1 1 13 C1 9 4 8 4 4 C6 6 7 7 8 0Z" fill="#FF9600"/><path d="M8 9 C9 12 11 12 11 15 A3 3 0 0 1 5 15 C5 13 7 12 8 9Z" fill="#FFC800"/></svg>'+n}
// una parada está "estudiada" cuando se vio su sesión con tutor: recién entonces sus preguntas se pueden preguntar
// (regla: nada se pregunta sin haberse enseñado antes)
const estudiada=sid=>!!(PR.vistas&&PR.vistas[sid]||PR.hechas[sid]);

/* ---------- MAPA: las 11 unidades ---------- */
// la mascota (la ampolleta de las sesiones con tutor) avanza por el camino
const AMPOLLETA=`<ellipse cx="30" cy="64" rx="20" ry="4" fill="#000" opacity=".35"/><circle cx="30" cy="24" r="21" fill="#FFC800"/><circle cx="23" cy="17" r="7" fill="#FFF6C7" opacity=".6"/><rect x="20" y="42" width="20" height="7" rx="3" fill="#9AB0BC"/><rect x="21" y="49" width="18" height="6" rx="3" fill="#7D93A0"/><rect x="24" y="55" width="12" height="5" rx="2.5" fill="#5E7380"/><circle cx="23" cy="22" r="3.2" fill="#2B2000"/><circle cx="37" cy="22" r="3.2" fill="#2B2000"/><circle cx="24" cy="21" r="1" fill="#fff"/><circle cx="38" cy="21" r="1" fill="#fff"/><path d="M24 30 Q30 35 36 30" stroke="#8A3B00" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
let STOPS=[];
function armarParadas(){STOPS=[];let sig=false;
 BANK.C.forEach(c=>{STOPS.push({sign:1,ch:c.et,t:c.t});
  c.ses.forEach(x=>{const done=!!PR.hechas[x.id];let s=done?'done':'ses';if(!done&&!sig){s='next';sig=true}
   STOPS.push({n:x.t,ic:x.ic,s,sid:x.id,m:x.m,cap:c.n})});
  const np=pendientes(c.n).length;STOPS.push({n:'Repaso de la '+c.et.toLowerCase()+(np?' ('+np+')':''),ic:'🔋',s:'review',cap:c.n},{n:'Prueba de la '+c.et.toLowerCase(),ic:'🏁',s:'test',cap:c.n})});
 STOPS.push({sign:1,ch:'Examen final',t:'Simulacro de examen'},{n:'Simulacro de examen',ic:'🏆',s:'exam'})}
const NS='http://www.w3.org/2000/svg',svg=$('map');
const W=400,GAP=260;
const COL={ses:['#1CB0F6','#1899D6'],done:['#58CC02','#46A302'],review:['#FF9600','#CC7800'],next:['#1CB0F6','#1899D6'],test:['#FFC800','#C99E00'],exam:['#CE82FF','#A568CC']};
const el=(tag,at,parent=svg)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);parent.appendChild(e);return e};
// un color por unidad
// sin verde: el verde queda solo para las paradas hechas
